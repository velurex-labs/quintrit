name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # `cargo test --workspace`: every test of the SDK that needs neither a model nor a network. SIMD variants run only when
  # the runner's CPU has the instruction set, so the AVX-512 tests are skipped where it is missing.
  rust:
    name: Rust tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The macOS runner is informative only: no Mac was available during development.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, experimental: false }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, experimental: false }
          - { name: windows-x86_64, os: windows-2025, experimental: false }
          - { name: macos-arm64, os: macos-15, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        working-directory: rust
        run: cargo test --workspace

  # The declared minimum Rust version (the NEON dot-product intrinsics are stable from 1.98).
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check
        working-directory: rust
        run: cargo check -p quintrit-core -p quintrit-format -p quintrit-runtime -p quintrit-c

  # The Python package: build the wheel, install it into a clean environment and run the tests that need no model.
  python:
    name: Python ${{ matrix.python }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, python: "3.9" }
          - { name: linux-x86_64, os: ubuntu-24.04, python: "3.13" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, python: "3.12" }
          - { name: windows-x86_64, os: windows-2025, python: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates/quintrit-py
      - name: Build the wheel
        working-directory: rust/crates/quintrit-py
        run: |
          python -m pip install maturin
          maturin build --release --out dist
      - name: Install the wheel and run the tests
        working-directory: rust/crates/quintrit-py
        run: |
          python -m pip install numpy pytest dist/*.whl
          python -m pytest

  # The C and C++ API: build the shared library with CMake and run the C and C++ tests with ctest.
  c-cpp:
    name: C and C++ (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-2025 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: |
          cmake -S rust/crates/quintrit-c -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # "Try it": build the command-line tool without any compiler flags, download the smallest model of the benchmark
  # set and check that greedy decoding gives the expected first words.
  try-it:
    name: Try it (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, exe: quintrit }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, exe: quintrit }
          - { name: windows-x86_64, os: windows-2025, exe: quintrit.exe }
    env:
      # The model revision and the checksum are pinned: a change of the published file makes the job fail clearly.
      MODEL_URL: https://huggingface.co/prism-ml/Ternary-Bonsai-1.7B-gguf/resolve/40e40ecfe50bdfab51628042b1f8f4e97f08acd0/Ternary-Bonsai-1.7B-Q2_0.gguf
      MODEL_SHA256: d97d94eb564590c9f0300e54d3f87bbbb25a78693d0ade9f6e177973dcb8228a
      MODEL_FILE: models/Ternary-Bonsai-1.7B-Q2_0.gguf
      EXPECTED_TEXT: "Ternary computing is a type of computing that uses only three possible states"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the command-line tool
        working-directory: rust
        run: cargo build --release -p quintrit-runtime --bin quintrit
      - name: Restore the model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ env.MODEL_SHA256 }}
      - name: Download the model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 5 --retry-delay 10 -o "$MODEL_FILE" "$MODEL_URL"
      - name: Verify the model
        run: echo "$MODEL_SHA256  $MODEL_FILE" | sha256sum -c -
      - name: Generate text
        run: |
          out=$(rust/target/release/${{ matrix.exe }} --model "$MODEL_FILE" --prompt "What is ternary computing?" \
            --chat-template --temp 0.0 --max-tokens 24 2>&1)
          echo "$out"
          echo "$out" | grep -F "$EXPECTED_TEXT"
