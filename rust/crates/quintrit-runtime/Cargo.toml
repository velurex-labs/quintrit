[package]
name = "quintrit-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "High-performance transformer inference engine and CLI for 1.60 bpw Velurex quantized models"

[dependencies]
quintrit-core = { path = "../quintrit-core", version = "0.2.0" }
quintrit-format = { path = "../quintrit-format", version = "0.2.0" }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
ahash = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Comparison baseline (Rust only, not published): the BitNet kernels, enabled with the feature `bitnet-baseline`.
quintrit-bitnet = { path = "../quintrit-bitnet", optional = true }
# NVIDIA GPU backend (needs the CUDA driver at run time and the CUDA toolkit to build the kernels), enabled with the feature `cuda`.
quintrit-cuda = { path = "../quintrit-cuda", version = "0.2.0", optional = true }

[features]
default = []
# Adds the BitNet kernels `BitnetMad` and `BitnetMad512` (4 trits per byte) to compare them with the quintrit kernels.
bitnet-baseline = ["dep:quintrit-bitnet"]
# Runs the decoder on an NVIDIA GPU (compute capability 8.0 or newer) with results bit-identical to the CPU path.
cuda = ["dep:quintrit-cuda"]

[[bin]]
name = "quintrit"
path = "src/bin/quintrit.rs"

[[bench]]
name = "e2e_avx2_neon_bench"
harness = false

[[bench]]
name = "e2e_avx512_bench"
harness = false

[[bench]]
name = "token_profile"
harness = false

[[bench]]
name = "token_energy"
harness = false

[[bench]]
name = "attention_threshold"
harness = false

[[example]]
name = "gpu_decode_bench"
required-features = ["cuda"]
